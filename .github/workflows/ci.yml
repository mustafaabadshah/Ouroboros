name: Project Ouroboros CI (Offline & Hardened)

on:
  push:
    branches: [ main, hotfix/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-secrets:
    name: Code Hygiene, Syntax & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Git Diff Cleanliness
        run: git diff --check

      - name: Python Syntax & Bytecode Compilation
        run: python -m compileall backend/ scripts/

      - name: Verify Zero Raw Secret Leaks
        run: |
          echo "Scanning for accidental committed API keys..."
          if grep -rn --exclude-dir={.git,.venv,node_modules,dist,scratch} "gsk_[a-zA-Z0-9]\{40,\}" .; then
            echo "CRITICAL SECURITY ERROR: Unredacted Groq API key found in repository!"
            exit 1
          fi
          echo "Secret scan passed cleanly. Zero unredacted keys found."

  backend-offline-suite:
    name: Backend Offline Safety & Regression Suite
    runs-on: ubuntu-latest
    needs: [code-quality-and-secrets]
    env:
      OUROBOROS_LIVE_AUTH: ""
      OUROBOROS_MOCK_ONLY: "1"
      PHOENIX_ENABLED: "false"
      SANDBOX_MODE: "restricted_local"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Phase 5.1.2 Safety Remediation Tests (18 tests)
        run: pytest backend/tests/unit/test_phase5_1_2_safety_remediation.py -v

      - name: Run Git Worktree Isolation Security Tests (7 tests)
        run: pytest backend/tests/unit/test_worktree_isolation_security.py -v

      - name: Run Complete Unit Test Suite
        run: pytest backend/tests/unit/ -v

      - name: Run End-to-End Scenarios Suite (Scenarios A through J)
        run: pytest backend/tests/integration/test_e2e_scenarios_suite.py -v

      - name: Run Acceptance Verification Protocol (20 checks)
        run: python backend/tests/verify_acceptance.py

  frontend-quality:
    name: Frontend TypeScript, Lint & Production Build
    runs-on: ubuntu-latest
    needs: [code-quality-and-secrets]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run Oxlint Linter
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript & Vite Production Build
        working-directory: frontend
        run: npm run build
