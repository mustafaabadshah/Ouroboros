name: Project Ouroboros CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Backend Unit & Adversarial Security Tests
        run: |
          pytest backend/tests/ -v

      - name: Run Acceptance Verification Protocol
        run: |
          python backend/tests/verify_acceptance.py

      - name: Run Benchmark Suite & Memory Ablation
        run: |
          python scripts/run_benchmarks.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run TypeScript & Vite Production Build
        working-directory: frontend
        run: npm run build
